<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Setup Personas</title>
    <link rel="stylesheet" href="/static/setup_persona.css">
</head>
<body>
    <h1>Setup local - Registro de personas</h1>

    <p>Esta pantalla debe usarse desde la laptop local conectada a la cámara.</p>

    <section>
        <h2>Datos de la persona</h2>

        <input type="text" id="nombre_persona" placeholder="Nombre completo">
        <label for="tipo">Tipo de persona</label>
        <select id="tipo">
            <option value="gobierno">Gobierno</option>
            <option value="proveedor">Proveedor</option>
        </select>
        <input type="text" id="telefono_persona" placeholder="Telefono">
        <label for="autorizador_persona">Quien Autoriza</label>
        <select id="autorizador_persona"></select>
        <button type="button" onclick="mostrarNuevoAutorizador()">+</button>
    <div id="form-nuevo-autorizador" style="display:none">
        <input type="text" id="nuevo-autorizador-nombre" placeholder="Nombre">
        <input type="text" id="nuevo-autorizador-puesto" placeholder="Puesto">
        <select id="nuevo-autorizador-departamento"></select>
        <input type="email" id="nuevo-autorizador-correo" placeholder="Correo">
        <input type="text" id="nuevo-autorizador-telefono" placeholder="Teléfono">
        <button type="button" onclick="agregarAutorizador()">Guardar</button>
    </div>
        <input type="email" id="correo_persona" placeholder="Correo">
        <label for="organizaciones">Departamento / Proveedor</label>
        <select id="organizaciones"></select>
        <button type="button" onclick="mostrarNuevaOrganizacion()">+</button>
        <div id="form-nueva-organizacion" style="display:none">
        <input type="text" id="nueva-organizacion" placeholder="Nombre nuevo">
        <button type="button" onclick="agregarOrganizacion()">Guardar</button>
        </div>
        <img id="qr-firma" style="display:none" alt="QR para firmar">


    </section>

    <section>
        <h2>Captura facial</h2>

        <p id="contador-rostros">Rostros capturados: 0/5</p>

        <button onclick="iniciarCamara()">Iniciar cámara</button>
        <button id="boton-tomar-rostro" onclick="tomarRostro()">Tomar foto rostro</button>
        <button onclick="cancelarCamara()">Cancelar captura</button>
    </section>

    <section>
        <button onclick="registrarPersona()">Registrar persona</button>
    </section>

    <p id="mensaje"></p>

    <script src="/static/auth.js"></script>
    <script src="/static/setup_persona.js?v=4"></script>
</body>
</html>
